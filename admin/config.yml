# Decap CMS configuration for odinin.com
# Docs: https://decapcms.org/docs/configuration-options/
backend:
  name: git-gateway
  branch: main            # change if your repository uses another branch
  commit_messages:
    update: "Update {{collection}} {{slug}}"

# Uncomment to test the editor on your computer with "npx decap-server"
# local_backend: true

site_url: https://odinin.com
display_url: https://odinin.com
logo_url: /images/odinin-mark.svg
locale: en

media_folder: "images/uploads"     # where uploaded files are stored in the repository
public_folder: "/images/uploads"   # the path used on the website

collections:
  - name: settings
    label: "Site settings"
    editor: { preview: false }
    files:
      - name: general
        label: "Footer, contact and logo"
        file: "content/settings.json"
        fields:
          - { label: "Company name (footer)", name: name, widget: string }
          - { label: "Motto (footer)", name: motto, widget: string }
          - { label: "Location (footer)", name: location, widget: string }
          - { label: "Contact email", name: email, widget: string, hint: "Shown on the main page and used by the enquiry form." }
          - { label: "Contact title", name: contact_title, widget: text, hint: "Main page only. Put *stars* around a word to make it italic. A new line starts a new line." }
          - { label: "Contact text", name: contact_text, widget: text }
          - { label: "Logo image", name: logo, widget: image, required: false, hint: "Leave empty to keep the animated infinity mark." }
          - { label: "Social share image", name: share_image, widget: image, required: false, hint: "Shown when a page is shared on LinkedIn, WhatsApp and similar. 1200 x 630 works best." }

  - name: pages
    label: "Page texts"
    editor: { preview: false }
    files:
      - name: "home"
        label: "Home page"
        file: "content/pages/home.json"
        fields:
          - { label: "Browser tab title", name: seo_title, widget: string, required: false }
          - { label: "Search description", name: seo_description, widget: text, required: false }
          - label: "Top of page"
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: "Headline", name: title, widget: string }
              - { label: "Headline, coloured part", name: accent, widget: string }
              - { label: "Intro", name: lead, widget: text }
          - label: "Sections"
            name: sections
            widget: object
            collapsed: false
            fields:
              - label: "Growth partner, not an agency"
                name: "about"
                widget: object
                collapsed: true
                fields:
                  - { label: "Title", name: title, widget: string, hint: "Put *stars* around a word to make it italic and coloured." }
                  - { label: "Subtitle", name: subtitle, widget: text }
              - label: "Brand"
                name: "brand"
                widget: object
                collapsed: true
                fields:
                  - { label: "Title", name: title, widget: string, hint: "Put *stars* around a word to make it italic and coloured." }
                  - { label: "Subtitle", name: subtitle, widget: text }
              - label: "Marketing"

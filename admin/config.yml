  - name: faq
    label: "Common questions"
    editor: { preview: false }
    files:
      - name: "business-development"
        label: "Questions on the Business Development page"
        file: "content/faq/business-development.json"
        fields:
          - label: "Questions"
            name: items
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Answer", name: answer, widget: text }
      - name: "b2b-growth"
        label: "Questions on the B2B Growth page"
        file: "content/faq/b2b-growth.json"
        fields:
          - label: "Questions"
            name: items
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: question, widget: string }
              - { label: "Answer", name: answer, widget: text }

  - name: events
    label: "Event announcements"
    editor: { preview: false }
    files:
      - name: upcoming
        label: "Upcoming events (Events page)"
        file: "content/events.json"
        fields:
          - label: "Events"
            name: items
            widget: list
            summary: "{{fields.date | date('D MMM YYYY')}}  {{fields.title}}"
            hint: "Only events marked Published and not yet in the past appear on the site, sorted by date."
            fields:
              - { label: "Published", name: published, widget: boolean, default: false }
              - { label: "Title", name: title, widget: string }
              - { label: "Date", name: date, widget: datetime, date_format: "D MMM YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Time", name: time, widget: string, required: false, hint: "For example 18:30 to 21:00" }
              - { label: "Location", name: location, widget: string, required: false }
              - { label: "Short description", name: summary, widget: text, required: false }
              - { label: "Image", name: image, widget: image, required: false }
              - { label: "Button text", name: button, widget: string, required: false, default: "Register interest" }
              - { label: "Button link", name: link, widget: string, required: false, hint: "Leave empty to open the enquiry form with Events selected." }
